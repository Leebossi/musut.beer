<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>musut.beer</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <h1>Private Access</h1>
        <p>Enter passphrase to unlock protected content.</p>
        <form id="unlock-form">
          <label for="passphrase">Passphrase</label>
          <input id="passphrase" name="passphrase" type="password" required minlength="6" />
          <button type="submit">Unlock</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
        <a id="protected-link" href="/protected/library.json" hidden>Open protected resource</a>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
