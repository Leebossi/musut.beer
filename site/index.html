<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>musut.beer</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="auth-view">
    <main class="shell">
      <section class="card auth-card">
        <img class="auth-hero" src="/assets/erottaja_bg.png" alt="erottaja" />
        <h1>SEIS!</h1>
        <div class="countdown" id="countdown" aria-live="polite">
          <p class="countdown-time">Syötä salasana</p>
        </div>
        <form id="unlock-form">
          <label for="passphrase">Kenelle ei tarjoilla enään?</label>
          <input
            type="password"
            id="passphrase"
            name="passphrase"
            autocomplete="off"
            required
          />
          <button type="submit">Unlock</button>
        </form>
        <p id="status" aria-live="polite"></p>
        <a id="protected-link" href="/protected/index.html" hidden>Open protected content</a>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
