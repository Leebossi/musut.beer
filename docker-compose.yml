services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./infra/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway

  gateway:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm start"
    environment:
      HOST: ${GATEWAY_HOST:-0.0.0.0}
      PORT: ${GATEWAY_PORT:-8787}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-300}
      TOKEN_SIGNING_KEY: ${TOKEN_SIGNING_KEY:-dev-signing-key-change-me}
      PASSPHRASE_HASH: ${PASSPHRASE_HASH:-_uOcI4VuPZ3VAIYaMJA1SLiHiZQpGy_vf_8vU7MHPAw}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PROTECTED_ORIGIN: ${PROTECTED_ORIGIN:-http://protected-origin}
    volumes:
      - ./gateway:/app
    expose:
      - "${GATEWAY_PORT:-8787}"
    depends_on:
      - protected-origin

  protected-origin:
    image: nginx:1.27-alpine
    volumes:
      - ./protected:/usr/share/nginx/html:ro
    expose:
      - "80"
