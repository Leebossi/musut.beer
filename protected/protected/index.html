<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>~*~ musut.beer Members Area ~*~</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="dash-view">
    <table class="page-table" align="center" cellpadding="0" cellspacing="0">
      <tr>
        <td class="banner-cell">
          <marquee behavior="scroll" direction="left" scrollamount="4">
            *** WELCOME TO THE MEMBERS AREA *** BEST VIEWED IN 800x600 *** DO NOT LEAK PASSWORD ***
          </marquee>
        </td>
      </tr>
      <tr>
        <td>
          <table class="layout-table" cellpadding="10" cellspacing="0">
            <tr>
              <td class="main-cell">
                <img class="banner-gif" src="assets/gifs/casino.gif" alt="Casino GIF" />
                <p class="dash-sub" id="dash-status">Loading...</p>
                <hr class="rainbow-rule" />

                <table class="section-table" width="100%" cellpadding="6" cellspacing="0">
                  <tr><td class="section-title">☆ Photo Gallery ☆</td></tr>
                  <tr>
                    <td>
                      <table class="gallery-grid" id="gallery-grid" cellpadding="4" cellspacing="0"></table>
                    </td>
                  </tr>
                </table>

                <hr class="rainbow-rule" />

                <table class="section-table" width="100%" cellpadding="6" cellspacing="0">
                  <tr><td class="section-title">☆ File Downloads ☆</td></tr>
                  <tr>
                    <td>
                      <table class="downloads-list" id="downloads-list" width="100%" cellpadding="4" cellspacing="0"></table>
                    </td>
                  </tr>
                </table>

                <hr class="rainbow-rule" />

                <p class="webring">
                  <span class="hit-counter">Visitors: <span id="hit-count">000042</span></span>
                </p>


                <p class="footer-badge">
                  <img src="assets/gifs/macmade-blkwtbrdrspin.gif" alt="Made on a Mac" />
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
    <script src="script.js" defer></script>
  </body>
</html>
